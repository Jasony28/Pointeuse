<!-- Icône Pointeuse : badge de pointage validé (anneau de temps + coche) sur fond vert-bleu. Tout tient dans la zone sûre des icônes « maskable ». -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f4c4a"/><stop offset=".55" stop-color="#0a3533"/><stop offset="1" stop-color="#05201f"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="60%" r="50%"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".30"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <radialGradient id="sheen" cx="30%" cy="0%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d5f5ef"/></linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="kn" x="-100%" y="-100%" width="300%" height="300%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#5eead4" flood-opacity=".9"/></filter></defs><rect width="512" height="512" fill="url(#bg)"/><rect width="512" height="512" fill="url(#glow)"/><rect width="512" height="512" fill="url(#sheen)"/>
<g filter="url(#sh)"><rect x="136" y="118" width="240" height="290" rx="34" fill="url(#txt)"/></g>
<rect x="216" y="142" width="80" height="16" rx="8" fill="#0a3533" fill-opacity=".25"/>
<circle cx="256" cy="262" r="70" fill="none" stroke="#0f766e" stroke-opacity=".18" stroke-width="16"/>
<path d="M256 192 A70 70 0 1 1 195.4 297" fill="none" stroke="url(#arc)" stroke-width="16" stroke-linecap="round"/>
<path d="M226 262 L248 284 L290 240" fill="none" stroke="#0f766e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="186" y="358" width="140" height="14" rx="7" fill="#0a3533" fill-opacity=".18"/></svg>