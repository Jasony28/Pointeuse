<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône Pointeuse : monogramme « P » dont la boucle est un cadran d'horloge. Formes géométriques pures (aucun texte, aucune texture) ; tout tient dans la zone sûre des icônes « maskable ». -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2e1065" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g filter="url(#shadow)" fill="#fff">
    <!-- jambe du P -->
    <rect x="156" y="100" width="52" height="312" rx="6"/>
    <!-- boucle du P en « D » = cadran -->
    <path d="M200 126 H256 A74 74 0 0 1 256 274 H200" fill="none" stroke="#fff" stroke-width="52" stroke-linejoin="round"/>
  </g>
  <!-- aiguilles : 12 h et 3 h -->
  <line x1="256" y1="200" x2="256" y2="172" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
  <line x1="256" y1="200" x2="278" y2="200" stroke="#fff" stroke-width="11" stroke-linecap="round"/>
  <circle cx="256" cy="200" r="9" fill="#fff"/>
</svg>
